<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1180" height="610" viewBox="0 0 1180 610" role="img"
     aria-label="Anoop Ambrose cybersecurity profile banner">
  <title>Anoop Ambrose — Cybersecurity Professional</title>
  <desc>Premium cybersecurity profile banner highlighting SOC operations, SIEM, Wazuh, detection engineering, incident investigation, network and web security, and controlled penetration-testing labs.</desc>

  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#7C3AED;#2563EB" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#7C3AED;#2563EB;#06B6D4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#2563EB;#06B6D4;#7C3AED" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="ambient" cx="75%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".08"/>
      <stop offset="45%" stop-color="#06B6D4" stop-opacity=".035"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E2E8F0" stroke-opacity=".45" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="cardClip"><rect x="18" y="18" width="1144" height="574" rx="24"/></clipPath>
    <mask id="scanMask">
      <rect width="1180" height="610" fill="black"/>
      <rect x="18" y="18" width="1144" height="574" rx="24" fill="white"/>
    </mask>
  </defs>

  <rect width="1180" height="610" fill="#FFFFFF"/>
  <g clip-path="url(#cardClip)">
    <rect x="18" y="18" width="1144" height="574" rx="24" fill="#FFFFFF"/>
    <rect x="18" y="18" width="1144" height="574" fill="url(#ambient)"/>
    <rect x="18" y="18" width="1144" height="574" fill="url(#grid)" opacity=".52"/>

    <circle cx="1040" cy="70" r="130" fill="#2563EB" opacity=".05" filter="url(#soft)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-18 14;0 0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="550" r="110" fill="#7C3AED" opacity=".045" filter="url(#soft)">
      <animateTransform attributeName="transform" type="translate" values="0 0;14 -10;0 0" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- Left identity terminal -->
    <rect x="40" y="40" width="398" height="530" rx="18" fill="#F8FAFC" fill-opacity=".92" stroke="rgba(15,23,42,.10)"/>
    <rect x="40" y="40" width="398" height="42" rx="18" fill="#FFFFFF" fill-opacity=".72"/>
    <circle cx="62" cy="61" r="5" fill="#EF4444"/>
    <circle cx="79" cy="61" r="5" fill="#F59E0B"/>
    <circle cx="96" cy="61" r="5" fill="#10B981"/>
    <text x="118" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#475569">security-lab / identity</text>

    <text x="62" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#475569">$ whoami</text>
    <text x="62" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" fill="url(#accent)">anoop@security-lab</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="url(#accent)">
      <text x="62" y="158" opacity="0"><animate attributeName="opacity" values="0;1" begin=".3s" dur=".5s" fill="freeze"/>[ SOC ]</text>
      <text x="62" y="180" opacity="0"><animate attributeName="opacity" values="0;1" begin=".7s" dur=".5s" fill="freeze"/>[ SIEM ]</text>
      <text x="62" y="202" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.1s" dur=".5s" fill="freeze"/>[ LOG ]</text>
      <text x="62" y="224" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.5s" dur=".5s" fill="freeze"/>[ ALERT ]</text>
      <text x="62" y="246" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.9s" dur=".5s" fill="freeze"/>[ TRACE ]</text>
    </g>

    <!-- Abstract ASCII / console portrait -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
       font-size="15" font-weight="700" fill="url(#accent)" opacity=".94">
      <text x="76" y="282">          .--------.</text>
      <text x="76" y="300">       .-'  [SOC]  '-.</text>
      <text x="76" y="318">      /   .--------.   \</text>
      <text x="76" y="336">     /   /  ▣  ▣  \   \</text>
      <text x="76" y="354">    |   |     ▾     |   |</text>
      <text x="76" y="372">    |   |  .----.   |   |</text>
      <text x="76" y="390">     \   \ '----'  /   /</text>
      <text x="76" y="408">      '._ '------' _. '</text>
      <text x="76" y="426">         '--.  .--'</text>
      <text x="76" y="444">            \/</text>
      <text x="76" y="462">       [ DETECT / INVESTIGATE ]</text>
    </g>

    <rect x="62" y="270" width="350" height="205" fill="none" stroke="#06B6D4" stroke-opacity=".12"/>
    <rect x="62" y="270" width="350" height="2" fill="url(#accent)" opacity=".65">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 200;0 0" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="62" y="505" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#475569">hands-on cybersecurity practitioner</text>
    <text x="62" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#64748B">Building • Breaking • Detecting • Investigating</text>
    <circle cx="62" cy="550" r="4" fill="#10B981">
      <animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="74" y="554" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#475569">LAB ENVIRONMENT • CONTROLLED</text>

    <!-- Right terminal -->
    <rect x="456" y="40" width="686" height="530" rx="18" fill="#F8FAFC" fill-opacity=".95" stroke="rgba(15,23,42,.10)"/>
    <rect x="456" y="40" width="686" height="42" rx="18" fill="#FFFFFF" fill-opacity=".72"/>
    <circle cx="478" cy="61" r="5" fill="#EF4444"/>
    <circle cx="495" cy="61" r="5" fill="#F59E0B"/>
    <circle cx="512" cy="61" r="5" fill="#10B981"/>
    <text x="535" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#475569">profile -- verbose</text>

    <text x="480" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#475569">$ ./profile --verbose</text>
    <text x="480" y="137" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Hi 👋</text>
    <text x="480" y="169" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0F172A">I'm Anoop Ambrose</text>
    <rect x="480" y="184" width="636" height="1" fill="url(#accent)" opacity=".45"/>

    <!-- role ticker using discrete SMIL text changes -->
    <text x="480" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="15" font-weight="700" fill="url(#accent)">
      <tspan>SOC Analyst</tspan>
      <set attributeName="display" to="none" begin="2.0s"/>
      <set attributeName="display" to="inline" begin="0s"/>
    </text>
    <text x="480" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="15" font-weight="700" fill="url(#accent)" display="none">Security Engineer
      <set attributeName="display" to="inline" begin="2.0s"/>
      <set attributeName="display" to="none" begin="4.0s"/>
    </text>
    <text x="480" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="15" font-weight="700" fill="url(#accent)" display="none">Penetration Testing Enthusiast
      <set attributeName="display" to="inline" begin="4.0s"/>
      <set attributeName="display" to="none" begin="6.5s"/>
    </text>
    <text x="480" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="15" font-weight="700" fill="url(#accent)" display="none">Detection Engineering
      <set attributeName="display" to="inline" begin="6.5s"/>
      <set attributeName="display" to="none" begin="8.8s"/>
    </text>
    <text x="480" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="15" font-weight="700" fill="url(#accent)" display="none">SIEM &amp; Incident Investigation
      <set attributeName="display" to="inline" begin="8.8s"/>
      <set attributeName="display" to="none" begin="11.5s"/>
    </text>
    <rect x="480" y="201" width="7" height="16" fill="#06B6D4" opacity=".9">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- sequential profile facts -->
    <g font-family="Inter, Arial, sans-serif" font-size="12.5">
      <text x="480" y="245" fill="#475569">LOCATION</text>
      <text x="570" y="245" fill="#0F172A">Kerala, India</text>
      <text x="480" y="267" fill="#475569">FOCUS</text>
      <text x="570" y="267" fill="#0F172A">SOC • SIEM • Detection Engineering</text>
      <text x="480" y="289" fill="#475569">SECURITY</text>
      <text x="570" y="289" fill="#0F172A">Incident Investigation • Web Security</text>
      <text x="480" y="311" fill="#475569">ENVIRONMENT</text>
      <text x="570" y="311" fill="#0F172A">Kali Linux • Ubuntu • Windows</text>
      <text x="480" y="333" fill="#475569">PORTFOLIO</text>
      <text x="570" y="333" fill="url(#accent)">anoopambrose.com</text>
    </g>

    <!-- toolkit -->
    <text x="480" y="361" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#475569">SECURITY TOOLKIT</text>
    <g font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#0F172A">
      <g fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".42">
        <rect x="480" y="372" width="54" height="22" rx="11"/><rect x="540" y="372" width="70" height="22" rx="11"/>
        <rect x="616" y="372" width="57" height="22" rx="11"/><rect x="679" y="372" width="62" height="22" rx="11"/>
        <rect x="747" y="372" width="47" height="22" rx="11"/><rect x="800" y="372" width="73" height="22" rx="11"/>
        <rect x="879" y="372" width="62" height="22" rx="11"/><rect x="947" y="372" width="48" height="22" rx="11"/>
        <rect x="1001" y="372" width="58" height="22" rx="11"/>
      </g>
      <text x="507" y="387" text-anchor="middle">Wazuh</text><text x="575" y="387" text-anchor="middle">Kali Linux</text>
      <text x="644" y="387" text-anchor="middle">Ubuntu</text><text x="710" y="387" text-anchor="middle">Windows</text>
      <text x="770" y="387" text-anchor="middle">Nmap</text><text x="836" y="387" text-anchor="middle">Burp Suite</text>
      <text x="910" y="387" text-anchor="middle">Gobuster</text><text x="971" y="387" text-anchor="middle">Hydra</text>
      <text x="1030" y="387" text-anchor="middle">Apache</text>

      <g fill="#FFFFFF" stroke="#7C3AED" stroke-opacity=".40">
        <rect x="480" y="400" width="48" height="22" rx="11"/><rect x="534" y="400" width="55" height="22" rx="11"/>
        <rect x="595" y="400" width="34" height="22" rx="11"/><rect x="635" y="400" width="58" height="22" rx="11"/>
        <rect x="699" y="400" width="70" height="22" rx="11"/><rect x="775" y="400" width="104" height="22" rx="11"/>
        <rect x="885" y="400" width="78" height="22" rx="11"/>
      </g>
      <text x="504" y="415" text-anchor="middle">Bash</text><text x="561" y="415" text-anchor="middle">Python</text>
      <text x="612" y="415" text-anchor="middle">Git</text><text x="664" y="415" text-anchor="middle">GitHub</text>
      <text x="734" y="415" text-anchor="middle">VirtualBox</text><text x="827" y="415" text-anchor="middle">MITRE ATT&amp;CK</text>
      <text x="924" y="415" text-anchor="middle">Wireshark</text>
      <text x="978" y="415" text-anchor="middle">Networking</text>
    </g>

    <!-- bottom lab workflow -->
    <rect x="480" y="437" width="394" height="110" rx="12" fill="#FFFFFF" fill-opacity=".72" stroke="rgba(15,23,42,.10)"/>
    <text x="494" y="456" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#475569">LAB EXPERIENCE</text>
    <text x="494" y="474" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#64748B">$ wazuh-status</text>
    <text x="610" y="474" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#10B981">✓ SIEM ONLINE</text>
    <text x="494" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#64748B">$ detection --ssh-bruteforce</text>
    <text x="690" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#10B981">✓ ALERT GENERATED</text>
    <text x="494" y="506" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#64748B">$ web-enum --target citadel</text>
    <text x="700" y="506" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#10B981">✓ HTTP ACTIVITY</text>
    <text x="494" y="522" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#64748B">$ incident --investigate</text>
    <text x="654" y="522" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#10B981">✓ ATT&amp;CK MAPPED</text>

    <!-- SOC status panel -->
    <rect x="888" y="437" width="228" height="110" rx="12" fill="#FFFFFF" fill-opacity=".72" stroke="rgba(15,23,42,.10)"/>
    <text x="902" y="456" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" fill="#475569">SOC LAB</text>
    <g font-family="Inter, Arial, sans-serif" font-size="9.5" fill="#0F172A">
      <circle cx="904" cy="474" r="3.5" fill="#10B981"><animate attributeName="r" values="3;4;3" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="914" y="477">SIEM ONLINE</text>
      <circle cx="904" cy="491" r="3.5" fill="#10B981"><animate attributeName="r" values="3;4;3" dur="1.9s" repeatCount="indefinite"/></circle>
      <text x="914" y="494">AGENTS ACTIVE</text>
      <circle cx="904" cy="508" r="3.5" fill="#10B981"><animate attributeName="r" values="3;4;3" dur="2.1s" repeatCount="indefinite"/></circle>
      <text x="914" y="511">DETECTIONS ACTIVE</text>
      <circle cx="904" cy="525" r="3.5" fill="#10B981"><animate attributeName="r" values="3;4;3" dur="1.7s" repeatCount="indefinite"/></circle>
      <text x="914" y="528">LOG ANALYSIS ENABLED</text>
    </g>

    <!-- workflow -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="700">
      <text x="480" y="563" fill="#475569">RECON</text><text x="570" y="563" fill="#475569">ATTACK</text>
      <text x="665" y="563" fill="#475569">DETECTION</text><text x="785" y="563" fill="#475569">INVESTIGATE</text>
      <text x="910" y="563" fill="#475569">MITRE ATT&amp;CK</text>
      <path d="M520 560H560 M612 560H650 M720 560H770 M850 560H900" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="4 4">
        <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <circle cx="512" cy="560" r="3" fill="#06B6D4"/><circle cx="604" cy="560" r="3" fill="#06B6D4"/>
      <circle cx="712" cy="560" r="3" fill="#7C3AED"/><circle cx="842" cy="560" r="3" fill="#7C3AED"/>
      <circle cx="902" cy="560" r="3" fill="#7C3AED"/>
    </g>

    <!-- links -->
    <g font-family="Inter, Arial, sans-serif" font-size="10" fill="#475569">
      <text x="1025" y="108">GitHub</text>
      <text x="1025" y="126">LinkedIn</text>
      <text x="1025" y="144">Portfolio</text>
    </g>
    <g fill="none" stroke="url(#accent)" stroke-width="1.2" opacity=".65">
      <circle cx="1012" cy="104" r="6"/><circle cx="1012" cy="122" r="6"/><circle cx="1012" cy="140" r="6"/>
    </g>

    <!-- scanline -->
    <rect x="18" y="18" width="1144" height="3" fill="url(#accent)" opacity=".12" mask="url(#scanMask)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 574;0 0" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="18" y="18" width="1144" height="574" rx="24" fill="none" stroke="url(#accent)" stroke-opacity=".42">
    <animate attributeName="stroke-opacity" values=".25;.55;.25" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>